use_default_settings: true

server:
  secret_key: "cambia_esta_clave_larga"
  bind_address: "0.0.0.0"
  port: 8080

ui:
  default_locale: "es"

search:
  safe_search: 1
  autocomplete: "duckduckgo"
  formats:
    - html
    - json

engines:
  keep_only:
    - duckduckgo
    - brave
    - qwant
    - wikipedia
    - wikidata
    - arxiv
    - crossref

  # Subimos peso a motores generales
  - name: duckduckgo
    disabled: false
    weight: 2
  - name: brave
    disabled: false
  - name: qwant
    disabled: false

  # Motores de conocimiento / papers
  - name: wikipedia
    disabled: false
  - name: wikidata
    disabled: false
  - name: arxiv
    disabled: false
  - name: crossref
    disabled: false
